# Drive-Flex — site-wide speed settings for Nginx.
# AlmaLinux/RHEL: install this to /etc/nginx/conf.d/driveflex-performance.conf
# (nginx.conf includes conf.d/*.conf INSIDE the http{} block, so these apply to every server,
# including the 443 server block that certbot manages — that file never needs editing).

# HTTP/2: each visitor uses one multiplexed connection instead of up to six HTTP/1.1
# connections that each pay for their own TLS handshake. Needs Nginx 1.25.1+.
http2 on;

# Compress pages and other text responses. The app already serves CSS/JS pre-compressed
# (Brotli), and Nginx leaves responses that are already compressed untouched.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;
