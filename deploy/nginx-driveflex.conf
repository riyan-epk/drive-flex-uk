# Drive-Flex — Nginx reverse proxy for the Kestrel app on 127.0.0.1:5000
# AlmaLinux/RHEL: install this to /etc/nginx/conf.d/driveflex.conf
# (nginx.conf includes conf.d/*.conf INSIDE the http{} block, so the map below is valid here).
# certbot will later edit ONLY the "server" block (adds port 443 + SSL); the map stays intact.
# SELinux note: run `setsebool -P httpd_can_network_connect 1` or Nginx returns 502 to the app.

# Blazor Server uses WebSockets (SignalR). This map lets Nginx pass the Upgrade header through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN www.YOURDOMAIN;

    # Allow large-ish requests (form posts) and long-lived SignalR circuits.
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket / SignalR support (required for Blazor Server interactivity)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Pass the real client info + original scheme so the app builds correct https:// URLs
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 100s;   # keep the Blazor circuit alive
    }
}
